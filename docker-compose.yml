version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: one-piece-timeline-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: one_piece_timeline
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - one-piece-network

volumes:
  mongodb_data:
    driver: local

networks:
  one-piece-network:
    driver: bridge
