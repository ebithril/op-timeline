openapi: 3.0.3
info:
  title: One Piece Timeline API
  description: |
    A collaborative wiki-style timeline API for tracking events in the One Piece manga.

    ## Authentication
    Most write operations require authentication via API key in the `X-API-Key` header.

    ## User Roles
    - **Viewer**: Can view all content but cannot make changes
    - **Editor**: Can create and edit events and characters
    - **Admin**: Full access including delete, revert, and user management
  version: 1.0.0
  contact:
    name: One Piece Timeline
servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Event:
      type: object
      required:
        - name
        - type
        - dateType
        - sources
      properties:
        id:
          type: string
          description: Unique event identifier
        name:
          type: string
          description: Event name
        type:
          type: string
          enum: [Event, Birth, Death]
          description: Event type
        description:
          type: string
          description: Event description
        dateType:
          type: string
          enum: [Exact, Relative, Approximation]
          description: Type of date specification
        exactDate:
          type: integer
          description: Exact year (for Exact dates)
        approximation:
          type: string
          description: Text description (for Approximation dates)
        relativeDate:
          $ref: '#/components/schemas/RelativeDate'
        chapter:
          type: integer
          description: Manga chapter number
        involvedCharacters:
          type: array
          items:
            type: string
          description: List of character names
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          description: Source citations
        version:
          type: integer
          description: Version number
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp
        createdBy:
          type: string
          description: Username who created this event

    RelativeDate:
      type: object
      required:
        - referenceEventId
        - offset
        - unit
      properties:
        referenceEventId:
          type: string
          description: ID of the reference event
        offset:
          type: integer
          description: Offset from reference event
        unit:
          type: string
          enum: [Days, Weeks, Months, Years]
          description: Time unit

    Source:
      type: object
      required:
        - citation
      properties:
        citation:
          type: string
          description: Source citation text
        chapter:
          type: integer
          description: Chapter number
        page:
          type: integer
          description: Page number
        url:
          type: string
          description: URL reference

    Character:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: Unique character identifier
        name:
          type: string
          description: Character name
        birthDate:
          type: string
          description: Birth date
        deathDate:
          type: string
          description: Death date
        description:
          type: string
          description: Character description
        affiliations:
          type: array
          items:
            type: string
          description: Character affiliations

    User:
      type: object
      properties:
        id:
          type: string
          description: Unique user identifier
        username:
          type: string
          description: Username
        role:
          type: string
          enum: [Viewer, Editor, Admin]
          description: User role
        apiKey:
          type: string
          description: API key (only returned on creation)
        isActive:
          type: boolean
          description: Whether user is active
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

paths:
  # Event Endpoints
  /api/events:
    get:
      tags:
        - Events
      summary: Get all events
      description: Retrieve all timeline events
      security: []
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

    post:
      tags:
        - Events
      summary: Create new event
      description: Create a new timeline event (requires Editor or Admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}:
    get:
      tags:
        - Events
      summary: Get event by ID
      description: Retrieve a specific event by its ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Events
      summary: Update event
      description: Update an existing event (requires Editor or Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Events
      summary: Delete event
      description: Soft delete an event (requires Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      responses:
        '204':
          description: Event deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/character/{name}:
    get:
      tags:
        - Events
      summary: Get events by character
      description: Retrieve all events involving a specific character
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Character name
      responses:
        '200':
          description: List of events involving the character
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /api/events/{id}/history:
    get:
      tags:
        - Events
      summary: Get event version history
      description: Retrieve the complete version history for an event
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      responses:
        '200':
          description: List of event versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/revert/{version}:
    post:
      tags:
        - Events
      summary: Revert event to previous version
      description: Revert an event to a specific version (requires Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
        - name: version
          in: path
          required: true
          schema:
            type: integer
          description: Version number to revert to
      responses:
        '200':
          description: Event reverted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Character Endpoints
  /api/characters:
    get:
      tags:
        - Characters
      summary: Get all characters
      description: Retrieve all characters
      security: []
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Character'

    post:
      tags:
        - Characters
      summary: Create new character
      description: Create a new character (requires Editor or Admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Character'
      responses:
        '201':
          description: Character created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/characters/{id}:
    get:
      tags:
        - Characters
      summary: Get character by ID
      description: Retrieve a specific character by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Character ID
      responses:
        '200':
          description: Character details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Characters
      summary: Update character
      description: Update an existing character (requires Editor or Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Character ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Character'
      responses:
        '200':
          description: Character updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Characters
      summary: Delete character
      description: Delete a character (requires Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Character ID
      responses:
        '204':
          description: Character deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/characters/search/{query}:
    get:
      tags:
        - Characters
      summary: Search characters
      description: Search for characters by name
      security: []
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: List of matching characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Character'

  /api/characters/alive-at/{date}:
    get:
      tags:
        - Characters
      summary: Get characters alive at date
      description: Get all characters who were alive at a specific date
      security: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: integer
          description: Date (absolute days)
      responses:
        '200':
          description: List of characters alive at the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Character'

  # User Endpoints
  /api/users/me:
    get:
      tags:
        - Users
      summary: Get current user info
      description: Get information about the authenticated user
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Get all users (requires Admin role)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Users
      summary: Create new user
      description: Create a new user (requires Admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - role
              properties:
                username:
                  type: string
                  description: Username
                role:
                  type: string
                  enum: [Viewer, Editor, Admin]
                  description: User role
      responses:
        '201':
          description: User created successfully (includes generated API key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}/role:
    put:
      tags:
        - Users
      summary: Update user role
      description: Update a user's role (requires Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [Viewer, Editor, Admin]
                  description: New role
      responses:
        '200':
          description: User role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}:
    delete:
      tags:
        - Users
      summary: Deactivate user
      description: Deactivate a user account (requires Admin role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '204':
          description: User deactivated successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

tags:
  - name: Events
    description: Event management endpoints
  - name: Characters
    description: Character management endpoints
  - name: Users
    description: User management endpoints
