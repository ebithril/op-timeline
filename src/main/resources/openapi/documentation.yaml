  /api/characters/alive-at/{date}:
    get:
      tags: [Characters]
      summary: Get characters alive at specific date
      security: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
          description: Date in format year-month-day
      responses:
