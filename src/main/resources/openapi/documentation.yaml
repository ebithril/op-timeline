openapi: 3.0.3
info:
  title: One Piece Timeline API
  description: |
    A collaborative wiki-style timeline API for tracking events in the One Piece manga.

    ## Authentication
    Most write operations require authentication via API key in the `X-API-Key` header.

    ## User Roles
    - **Viewer**: Can view all content but cannot make changes
    - **Editor**: Can create and edit events and characters
    - **Admin**: Full access including delete, revert, and user management
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

paths:
  # Events
  /api/events:
    get:
      tags: [Events]
      summary: Get all events
      security: []
      responses:
        '200':
          description: List of all events
        '500':
          description: Internal server error
    post:
      tags: [Events]
      summary: Create new event
      description: Requires Editor or Admin role
      responses:
        '201':
          description: Event created
        '401':
          description: Unauthorized

  /api/events/{id}:
    get:
      tags: [Events]
      summary: Get event by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event details
        '404':
          description: Event not found
    put:
      tags: [Events]
      summary: Update event
      description: Requires Editor or Admin role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event updated
        '401':
          description: Unauthorized
    delete:
      tags: [Events]
      summary: Delete event
      description: Requires Admin role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event deleted
        '401':
          description: Unauthorized

  /api/events/character/{name}:
    get:
      tags: [Events]
      summary: Get events by character
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of events involving the character

  /api/events/{id}/children:
    get:
      tags: [Events]
      summary: Get child events
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of child events

  /api/events/{id}/timeline:
    get:
      tags: [Events]
      summary: Get event timeline
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timeline of child events

  /api/events/{id}/history:
    get:
      tags: [Events]
      summary: Get event version history
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of event versions

  /api/events/{id}/revert/{version}:
    post:
      tags: [Events]
      summary: Revert event to previous version
      description: Requires Admin role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event reverted
        '401':
          description: Unauthorized

